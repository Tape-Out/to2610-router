name: asic
on:
  workflow_dispatch:
    inputs:
      flow:
        description: ecc 预设：syn_sta 或 rtl2gds
        default: rtl2gds
      dep_refs:
        description: 依赖取哪个分支（空格分隔的 仓=分支），不写取各仓的默认分支
        default: ''
      from-run:
        description: 后端已由 .github 的 resume.yml 接完：给那一次的 run id，这里只跑门级冒烟
        default: ""
jobs:
  asic:
    uses: Tape-Out/.github/.github/workflows/asic.yml@main
    with:
      flow: ${{ inputs.flow }}
      from-run: ${{ inputs.from-run }}
      dep-refs: ${{ inputs.dep_refs }}
      apt: yosys
