# 两个网段各一台交换机，中间是这颗路由器：0 号口接 10.0.0.0/24，1 号口接 10.0.1.0/24。
# 主机把网关设成本网段的那个口（10.0.0.1 或 10.0.1.1），MTU 设成 114。
# 路由器不发 ARP：每台要跨网段的主机在这里各写一条，via 是那台主机网卡的 MAC。

[[port]]
mac = "02:00:00:00:01:00"
ip = "10.0.0.1"

[[port]]
mac = "02:00:00:00:01:01"
ip = "10.0.1.1"

[[route]]
to = "10.0.0.10/32"
port = 0
via = "02:00:00:00:00:10"

[[route]]
to = "10.0.0.11/32"
port = 0
via = "02:00:00:00:00:11"

[[route]]
to = "10.0.1.10/32"
port = 1
via = "02:00:00:00:00:12"

[[route]]
to = "10.0.1.11/32"
port = 1
via = "02:00:00:00:00:13"
